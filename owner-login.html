<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Login | Mauli Enterprises</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f8fc;
    color:#172033;
    min-height:100vh;
}

/* TOP BAR */
.topbar{
    background:#071a36;
    color:white;
    padding:10px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
}

.topbar a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

/* NAVBAR */
.navbar{
    background:white;
    padding:15px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:45px;
    height:45px;
    border-radius:12px;
    background:linear-gradient(135deg,#0b4f9c,#176dcc);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    font-weight:bold;
}

.logo h2{
    color:#082b58;
    font-size:20px;
}

.logo p{
    font-size:11px;
    color:#667085;
}

/* LOGIN AREA */
.login-section{
    min-height:calc(100vh - 125px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    border:1px solid #e5eaf1;
    border-radius:22px;
    padding:35px;
    box-shadow:0 15px 45px rgba(8,44,89,.15);
}

.crown{
    width:70px;
    height:70px;
    margin:0 auto 18px;
    border-radius:50%;
    background:linear-gradient(135deg,#ffd43b,#ffbf00);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:34px;
}

.login-box h1{
    text-align:center;
    color:#082b58;
    margin-bottom:8px;
}

.login-box .subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:28px;
    font-size:14px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    color:#24344d;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid #d9e1ec;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

.input-group input:focus{
    border-color:#0b62c4;
    box-shadow:0 0 0 3px rgba(11,98,196,.1);
}

.login-btn{
    width:100%;
    border:none;
    padding:14px;
    border-radius:10px;
    background:#ffd43b;
    color:#071a36;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#f5c400;
}

.back-btn{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#0b62c4;
    text-decoration:none;
    font-weight:bold;
}

.message{
    display:none;
    margin-top:18px;
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-size:14px;
}

/* MOBILE */
@media(max-width:550px){

    .topbar{
        flex-direction:column;
        gap:7px;
        text-align:center;
    }

    .topbar a{
        margin:0 5px;
    }

    .navbar{
        padding:12px 5%;
    }

    .logo h2{
        font-size:17px;
    }

    .login-box{
        padding:27px 20px;
    }
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div>📍 Shivane, Maval</div>

    <div>
        <a href="tel:8390778407">📞 8390778407</a>
        <a href="index.html">🏠 Home</a>
    </div>
</div>

<!-- NAVBAR -->
<div class="navbar">

    <div class="logo">

        <div class="logo-icon">M</div>

        <div>
            <h2>Mauli Enterprises</h2>
            <p>Xerox & Printing Shop</p>
        </div>

    </div>

</div>

<!-- LOGIN -->
<section class="login-section">

    <div class="login-box">

        <div class="crown">👑</div>

        <h1>Owner Login</h1>

        <p class="subtitle">
            Secure access to Mauli Enterprises Owner Panel
        </p>

        <form onsubmit="loginOwner(event)">

            <div class="input-group">
                <label>👤 Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter owner username"
                    required
                >
            </div>

            <div class="input-group">
                <label>🔐 Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                👑 Login to Owner Panel
            </button>

        </form>

        <div id="message" class="message"></div>

        <a href="index.html" class="back-btn">
            ← Back to Mauli Enterprises
        </a>

    </div>

</section>

<script>

function loginOwner(event){

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    /*
       DEMO LOGIN ONLY

       Real website मध्ये username/password
       frontend code मध्ये ठेवू नका.
       Backend authentication नंतर जोडायचे आहे.
    */

    if(username === "owner" && password === "1234"){

        message.style.display = "block";
        message.style.background = "#e8f7ee";
        message.style.color = "#16733b";
        message.innerHTML =
            "✅ Login successful! Opening Owner Dashboard...";

        setTimeout(function(){
            window.location.href = "owner-dashboard.html";
        },800);

    }else{

        message.style.display = "block";
        message.style.background = "#fff0f0";
        message.style.color = "#c62828";
        message.innerHTML =
            "❌ Invalid username or password.";

    }

}

</script>

</body>
</html>
